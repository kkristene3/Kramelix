plugins {
    alias(libs.plugins.android.application)
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.kramelix'
    // Use an SDK you have installed (36 is fine if you installed it; otherwise use 34/35)
    compileSdk 36

    defaultConfig {
        applicationId "com.example.kramelix"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // For emulator + device. If you only run on a phone, you can keep just "arm64-v8a".
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                // C++ compiler flags
                cppFlags "-O3 -fvisibility=hidden -fexceptions -frtti"
            }
        }

        // (Optional) flavors for Chaquopy
        flavorDimensions "pyVersion"
        productFlavors {
            py313 {
                dimension "pyVersion"
            }
        }
    }

    // Pin versions you actually have installed in SDK Manager
    ndkVersion "29.0.14033849"

    buildFeatures {
        prefab false
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

chaquopy {
    defaultConfig {
        version "3.13"
        // Either point to a real Python 3.13 exe, or remove this to use Chaquopy's build env.
        // On Windows, forward slashes or double-escaped backslashes work.
        buildPython "C:/Users/you/AppData/Local/Programs/Python/Python313/python.exe"

        pip{
            install("python-dotenv")
        }
    }
    productFlavors {
        py313 {
            version "3.13"
        }
    }
    sourceSets {
        main {
            srcDirs = ["src/main/python"]
        }
    }
}

dependencies {
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.activity)
    implementation(libs.constraintlayout)

    testImplementation(libs.junit)
    androidTestImplementation(libs.ext.junit)
    androidTestImplementation(libs.espresso.core)
}
